<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <title>Cookie Reader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 480px;
      min-height: 200px;
      font-family: 'Segoe UI', monospace;
      background: #0f0f0f;
      color: #e0e0e0;
    }

    header {
      background: #1a1a2e;
      padding: 12px 16px;
      border-bottom: 2px solid #00d4aa;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h1 {
      font-size: 15px;
      color: #00d4aa;
      letter-spacing: 1px;
    }

    #domain {
      font-size: 11px;
      color: #888;
      margin-left: auto;
    }

    #controls {
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      background: #161616;
      border-bottom: 1px solid #2a2a2a;
    }

    button {
      padding: 5px 12px;
      border: 1px solid #00d4aa;
      background: transparent;
      color: #00d4aa;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    button:hover {
      background: #00d4aa;
      color: #0f0f0f;
    }

    #count {
      margin-left: auto;
      font-size: 12px;
      color: #888;
      align-self: center;
    }

    #output {
      padding: 12px 16px;
      max-height: 400px;
      overflow-y: auto;
    }

    .cookie-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-left: 3px solid #00d4aa;
      border-radius: 4px;
      margin-bottom: 10px;
      padding: 10px 12px;
      font-size: 12px;
    }

    .cookie-card:hover {
      border-color: #00d4aa;
      background: #1f1f1f;
    }

    .cookie-name {
      color: #00d4aa;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .cookie-row {
      display: flex;
      gap: 6px;
      margin-bottom: 3px;
      word-break: break-all;
    }

    .label {
      color: #666;
      min-width: 70px;
      font-size: 11px;
    }

    .val {
      color: #ccc;
    }

    .val.value-field {
      color: #f0a500;
      font-family: monospace;
    }

    .badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 10px;
      margin-left: 4px;
    }

    .badge.httponly { background: #3a1a1a; color: #ff6b6b; border: 1px solid #ff6b6b44; }
    .badge.secure   { background: #1a3a1a; color: #6bff6b; border: 1px solid #6bff6b44; }
    .badge.session  { background: #1a1a3a; color: #6b9fff; border: 1px solid #6b9fff44; }

    #empty {
      text-align: center;
      color: #555;
      padding: 40px;
      font-size: 13px;
    }

    #raw-section {
      padding: 12px 16px;
      border-top: 1px solid #2a2a2a;
    }

    #raw-section summary {
      color: #555;
      font-size: 11px;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .section-title {
      color: #555;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid #2a2a2a;
    }

    .tab-badge {
      font-size: 10px;
      color: #f0a500;
      background: #2a1f00;
      border: 1px solid #f0a50044;
      border-radius: 4px;
      padding: 3px 8px;
      margin-left: 4px;
    }

    .saved-domain {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-left: 3px solid #555;
      border-radius: 4px;
      padding: 8px 12px;
      margin-bottom: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .saved-domain:hover {
      border-left-color: #00d4aa;
      background: #1f1f1f;
    }

    .saved-name { color: #ccc; font-size: 12px; }
    .saved-meta { color: #555; font-size: 10px; }

    #raw {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 10px;
      font-size: 10px;
      color: #888;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 150px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

<header>
  <h1>🍪 Cookie Reader</h1>
  <span id="domain"></span>
</header>

<div id="controls">
  <button id="btn-refresh">↺ Refresh</button>
  <button id="btn-copy">⎘ Copiaza JSON</button>
  <span id="count"></span>
</div>

<div id="output">
  <div id="empty">Se incarca...</div>
</div>

<details id="raw-section">
  <summary>▸ JSON raw</summary>
  <pre id="raw"></pre>
</details>

<script src="popup.js"></script>
</body>
</html>
